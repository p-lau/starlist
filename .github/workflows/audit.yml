name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    paths: ["Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
