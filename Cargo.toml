[workspace]
members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha1_smol = { version = "1", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[package]
name = "starlist"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["dashboard", "hub", "prometheus", "docker", "journald", "kubernetes", "otel", "loki"]
# Serve the embedded Svelte dashboard at `/` (built from dashboard/ when present).
dashboard = []
# The `hub` and `hub-token` commands. Collectors can push to a hub either way.
hub = ["dep:sha1_smol"]
# `--prometheus`: serve metrics at `/metrics`.
prometheus = []
# Log sources beyond files and stdin. Docker, journald and Kubernetes run the
# platform's own CLI and add no dependencies.
# `--docker NAME` / `--docker-label KEY=VALUE`: follow containers via `docker logs`.
docker = []
# `--journald UNIT`: follow a systemd unit via `journalctl`.
journald = []
# `--k8s deployment/NAME` or `--k8s SELECTOR`: follow pods via `kubectl logs`.
kubernetes = []
# `--otlp ADDR`: receive OTLP logs over HTTP (protobuf or JSON, gzip).
otel = ["dep:flate2"]
# `--loki URL --loki-query QUERY`: read a LogQL stream.
loki = []

[dependencies]
starlist-core = { path = "core" }
rmcp = { version = "3.9", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
schemars = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
regex.workspace = true
sha1_smol = { workspace = true, optional = true }
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
anyhow = "1"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
tower = { version = "0.5", default-features = false, features = ["util"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
# The MCP client is only used by the example agent and the end-to-end test.
rmcp = { version = "3.9", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false }

[[test]]
name = "dashboard"
required-features = ["dashboard"]

[[test]]
name = "hub"
required-features = ["hub"]

[[test]]
name = "otel"
required-features = ["otel"]

[[test]]
name = "loki"
required-features = ["loki"]

[[test]]
name = "command_sources"
required-features = ["docker", "journald", "kubernetes"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
