[package]
name = "starlist"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.9", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
sha1_smol = { version = "1", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
anyhow = "1"

[dev-dependencies]
# The MCP client is only used by the example agent and the end-to-end test.
rmcp = { version = "3.9", features = ["client", "transport-streamable-http-client-reqwest"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
