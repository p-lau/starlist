name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The dashboard is built on one OS so the tests there cover the embedded
      # app; the others test the build without it.
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Dashboard
        if: matrix.os == 'ubuntu-latest'
        working-directory: dashboard
        run: |
          npm ci
          npm run check
          npm run build
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # The plain MCP collector, without the dashboard, hub and Prometheus.
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - name: Tests (no default features)
        run: cargo test --workspace --locked --no-default-features
