name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command and flags you ran, and a few log lines that trigger it. Replace any real secrets or personal data.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `starlist --version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, and how starlist runs (binary, cargo build, container, sidecar).
  - type: input
    id: client
    attributes:
      label: Agent or MCP client
      description: For example Claude Code, over HTTP or stdio.
