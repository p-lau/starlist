name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The dashboard is built on one OS so the tests there cover the embedded
      # app; the others test the build without it.
      - uses: actions/setup-node@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Dashboard
        if: matrix.os == 'ubuntu-latest'
        working-directory: dashboard
        run: |
          npm ci
          npm run check
          npm run build
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # The plain MCP collector, without the dashboard, hub and Prometheus.
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - name: Tests (no default features)
        run: cargo test --workspace --locked --no-default-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Check (no default features)
        run: cargo check --workspace --all-targets --locked --no-default-features

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: starlist:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm starlist:ci --version
          docker run -d --name sl -p 127.0.0.1:7341:7341 -e STARLIST_TOKEN=ci-smoke-test-token-0123456789 starlist:ci \
            serve --file /data/app.log --http 0.0.0.0:7341 --db /data/starlist.db
          for i in $(seq 30); do
            curl -sf -H "Authorization: Bearer ci-smoke-test-token-0123456789" http://127.0.0.1:7341/api/v1/status > /dev/null && break
            sleep 1
          done
          curl -sf -H "Authorization: Bearer ci-smoke-test-token-0123456789" http://127.0.0.1:7341/api/v1/status || { docker logs sl; exit 1; }
          docker logs sl

  fuzz:
    name: Fuzz (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: parse_event
        run: cargo fuzz run parse_event fuzz/seeds/parse_event -- -max_total_time=60
      - name: redact
        run: cargo fuzz run redact fuzz/seeds/redact -- -max_total_time=60
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
